# =====================================================================
#  TP Messaging — attaches to the SHARED `middleware` network (base: the TP1 Spring Boot repo's `docker-compose.yml`, which runs
#  `listings-api` + `listings-postgres`). This project adds ONE service:
#       - rabbitmq          -> AMQP on host 5673 (internal 5672)
#                              management UI on host 15673 (internal 15672)
#
#  Port map (host) — the host offsets (5673 / 15673) mirror the
#  listings-postgres (5435) / keycloak (8081) convention: they never
#  collide with a RabbitMQ the student may run natively on 5672 / 15672.
#       listings-api          8080   (base — no change for this TP)
#       listings-postgres     5435   (base — no change)
#       rabbitmq (AMQP)       5673   (this file — app connects here from host)
#       rabbitmq (mgmt UI)    15673  (this file — curl / browser)
#
#  Network + resource sharing:
#    * The `middleware` network is created by the base project. This file
#      ATTACHES to it. Pinning it with `name: middleware` means both projects
#      use the same global Docker network, so the API and RabbitMQ can reach
#      each other by container name (listings-api <-> rabbitmq).
#    * Services discover each other by their `container_name`, NOT by
#      `localhost`. From inside the API container, the broker is
#      `rabbitmq:5672` (its INTERNAL port), never `localhost`.
#
#  BEFORE YOU RUN: read "Run" in this repo's `README.md`. It tells you the
#  required edit to make in the TP1 Spring Boot repo's `docker-compose.yml` (point the API at
#  the broker over the network name `rabbitmq`; the host port stays 8080).
#  The exact snippet is in the box at the bottom of this file.
#
#  Run order (base owns the API, so it is always there first):
#      $ cd <TP1-repo-folder>  && docker compose up -d   # base: API on 8080 + pg on 5435
#      $ cd <messaging-repo-folder> && docker compose up -d   # this: RabbitMQ on 5673 + 15673
#  Health (API) : curl -fsS http://localhost:8080/actuator/health
#  Health (MQ)  : curl -fsS -u listings:listings http://localhost:15673/api/overview
# =====================================================================

name: messaging-tp

networks:
  middleware:
    name: middleware      # SAME global network the base project creates

volumes:
  rabbit-data:

services:

  # ------------------------------------------------------------------
  #  RabbitMQ 4.x with the **management** plugin — the AMQP broker.
  #
  #  The `management` tag bundles the management HTTP API + UI, which this TP
  #  uses as the *observable* surface (see steps: ready counts, queues,
  #  bindings, DLQ, manual publish for the poison-message drill).
  #
  #  Credentials: `listings` / `listings` (RABBITMQ_DEFAULT_USER/PASS).
  #  The stock `guest` account is intentionally NOT used: RabbitMQ restricts
  #  `guest` to loopback only, so it cannot be reached from the API container
  #  over the shared network. `listings` is a normal administrator account
  #  reachable from any interface.
  #
  #  Internal port 5672 (AMQP) is published on host 5673, and the management
  #  API (internal 15672) on host 15673 — so a student's own local RabbitMQ on
  #  5672 / 15672 is never clobbered (same convention as listings-postgres
  #  5435 and keycloak 8081).
  #
  #  The API (listings-api) reaches us over the network name `rabbitmq` on
  #  our INTERNAL port 5672 (not the host 5673) — see the REQUIRED EDIT below.
  # ------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq          # stable name for cross-network DNS
    environment:
      RABBITMQ_DEFAULT_USER: listings
      RABBITMQ_DEFAULT_PASS: listings
    ports:
      - "5673:5672"    # host 5673 -> container 5672 (AMQP protocol)
      - "15673:15672"  # host 15673 -> container 15672 (management API + UI)
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    networks: [middleware]
    healthcheck:
      # `rabbitmq-diagnostics ping` is the broker's own liveness probe.
      # `rabbitmq-ctl status` would also work but is heavier.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# =====================================================================
#  REQUIRED EDIT in the TP1 Spring Boot repo's `docker-compose.yml`  (see this repo's README "Run")
#
#  In the `listings-api` service, add this to `environment:`. The API points
#  at the broker by its NETWORK NAME (`rabbitmq`) and its INTERNAL port
#  (5672) — from inside the API container `localhost` is the container itself,
#  so the API must reach the broker by its network name (`rabbitmq`), never by
#  `localhost`.
#
#      RABBITMQ_HOST: "rabbitmq"
#      RABBITMQ_PORT: "5672"
#
#  The credentials (`RABBITMQ_USERNAME` / `RABBITMQ_PASSWORD`) can stay as the
#  defaults declared in src/main/resources/application.yml (listings / listings)
#  — no edit needed unless you change them here.
# =====================================================================
